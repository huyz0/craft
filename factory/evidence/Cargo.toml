[package]
name = "craft-factory-evidence"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[dependencies]
base64 = "=0.22.1"
clap = { version = "=4.6.7", features = ["derive"] }
ring = "=0.17.14"
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.1"
time = { version = "=0.3.55", features = ["parsing"] }

[lints.rust]
unsafe_code = "deny"
