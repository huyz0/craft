[package]
name = "craft-factory-queue"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "=0.22.1"
clap = { version = "=4.6.7", features = ["derive"] }
craft-factory-evidence = { path = "../evidence" }
hyper-util = { version = "=0.1.20", features = ["http1", "server", "service", "tokio"] }
rustls-pemfile = "=2.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.1"
sqlx = { version = "=0.9.1", default-features = false, features = ["postgres", "json", "runtime-tokio", "tls-rustls-ring-native-roots"] }
subtle = "=2.6.1"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }

[build-dependencies]
sha2 = "=0.11.1"

[lints.rust]
unsafe_code = "deny"
