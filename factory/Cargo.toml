[package]
name = "craft-factory"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[dependencies]
base64 = "=0.22.1"
clap = { version = "=4.6.7", features = ["derive"] }
craft-factory-evidence = { path = "evidence" }
getrandom = "=0.2.17"
ring = "=0.17.14"
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.1"
time = { version = "=0.3.55", features = ["parsing"] }
ureq = { version = "=3.5.2", default-features = false, features = ["rustls", "json"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", features = ["signal", "process"] }
signal-hook = { version = "=0.4.6", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_SystemServices", "Win32_System_Threading"] }

[lints.rust]
unsafe_code = "deny"
