[workspace]
members = ["crates/craft-cli", "crates/craft-core", "crates/craft-platform", "crates/craft-runtime", "crates/craft-test-support", "crates/craft-workflows", "crates/craft-provider-jira", "crates/craft-provider-confluence", "crates/craft-provider-trello", "crates/craft-live-conformance"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
schemars = "=1.2.3"
sha2 = "=0.11.1"
thiserror = "=2.0.20"
jsonschema = { version = "=0.61.0", default-features = false }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
serde_path_to_error = "=0.1.20"
ctrlc = { version = "=3.5.2", default-features = false }
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }
getrandom = "=0.3.4"
windows-sys = { version = "=0.61.2", default-features = false }
nix = { version = "=0.31.3", default-features = false, features = ["user"] }
keyring-core = { version = "=1.0.1", default-features = false }
windows-native-keyring-store = { version = "=1.1.0", default-features = false }
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["keychain"] }
security-framework = { version = "=3.7.0", default-features = false }
secret-service = { version = "=5.2.0", default-features = false, features = ["rt-async-io-crypto-rust"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "json"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "time", "macros", "net"] }
url = "=2.5.8"
percent-encoding = "=2.3.2"
httpdate = "=1.0.3"
bytes = "=1.12.1"
http-body = "=1.1.0"
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
pulldown-cmark = { version = "=0.13.6", default-features = false }
quick-xml = { version = "=0.41.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
strip = true
